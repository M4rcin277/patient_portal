<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Portal Pacjenta{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    >
    <link rel="icon" type="image/png" href="/static/icons/favicon.png">
    <link rel="stylesheet" href="/static/css/app.css?v=83">
  </head>
  <body>
    <div class="app-layout">
      <header class="topbar">
        <a class="brand" href="/panel-pacjenta" aria-label="Portal Pacjenta">
          <div class="brand-mark">
            <img
              src="/static/icons/HospHeart.png"
              alt="Portal Pacjenta"
              class="brand-logo"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
            >
            <span class="brand-fallback">P</span>
          </div>
        </a>

        <nav class="topbar-nav" aria-label="Główna nawigacja">
          <a class="topbar-link {% if aktywna_strona == 'dashboard' %}active{% endif %}" href="/panel-pacjenta">
            <span class="topbar-icon">
              <img src="/static/icons/dashboard.svg" alt="" class="topbar-icon-img">
            </span>
            <span>Podsumowanie</span>
          </a>
          <a class="topbar-link {% if aktywna_strona == 'wizyty' %}active{% endif %}" href="/moje-wizyty">
            <span class="topbar-icon">
              <img src="/static/icons/visits.svg" alt="" class="topbar-icon-img">
            </span>
            <span>Wizyty</span>
          </a>
          <a class="topbar-link {% if aktywna_strona == 'szybki_zapis' %}active{% endif %}" href="/szybki-zapis">
            <span class="topbar-icon">
              <i class="bi bi-plus-lg topbar-icon-bi" aria-hidden="true"></i>
            </span>
            <span>Szybki zapis</span>
          </a>
          <a class="topbar-link {% if aktywna_strona == 'recepty' %}active{% endif %}" href="/recepty">
            <span class="topbar-icon">
              <i class="bi bi-clipboard-pulse topbar-icon-bi" aria-hidden="true"></i>
            </span>
            <span>Recepty</span>
          </a>
          <a class="topbar-link {% if aktywna_strona == 'lekarze' %}active{% endif %}" href="/lekarze-widok">
            <span class="topbar-icon">
              <img src="/static/icons/doctors.svg" alt="" class="topbar-icon-img">
            </span>
            <span>Lekarze</span>
          </a>
          <a class="topbar-link {% if aktywna_strona == 'leki' %}active{% endif %}" href="/leki">
            <span class="topbar-icon">
              <i class="bi bi-capsule topbar-icon-bi" aria-hidden="true"></i>
            </span>
            <span>Leki</span>
          </a>
        </nav>

        <div class="topbar-actions">
          <button class="topbar-notification" type="button" aria-label="Powiadomienia" data-app-message="Masz 2 nowe powiadomienia: przypomnienie o wizycie i aktywną e-receptę.">
            <i class="bi bi-bell" aria-hidden="true"></i>
          </button>

          <details class="topbar-profile-menu">
            <summary class="topbar-profile {% if aktywna_strona == 'profil' %}active{% endif %}">
              <div class="profile-avatar">
                {{ pacjent["imie"][0] }}{{ pacjent["nazwisko"][0] }}
              </div>
              <div>
                <p class="profile-name">{{ pacjent["imie"] }} {{ pacjent["nazwisko"] }}</p>
                <p class="profile-role">Pacjent</p>
              </div>
              <i class="bi bi-chevron-down profile-menu-chevron" aria-hidden="true"></i>
            </summary>

            <div class="profile-menu">
              <a href="/profil">
                <i class="bi bi-person-circle" aria-hidden="true"></i>
                Profil pacjenta
              </a>
              <a href="/ustawienia">
                <i class="bi bi-gear" aria-hidden="true"></i>
                Ustawienia
              </a>
              <a href="/historia">
                <i class="bi bi-clock-history" aria-hidden="true"></i>
                Historia
              </a>
              <button type="button" data-app-message="Wylogowanie będzie dostępne po dodaniu logowania użytkownika.">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                Wyloguj
              </button>
            </div>
          </details>
        </div>
      </header>

      <main class="main-content {% if aktywna_strona == 'dashboard' %}main-content-dashboard{% endif %}{% if aktywna_strona == 'wizyty' %} main-content-visits{% endif %}{% if aktywna_strona == 'szybki_zapis' %} main-content-booking{% endif %}{% if aktywna_strona == 'lekarze' %} main-content-doctors{% endif %}{% if aktywna_strona == 'leki' %} main-content-medicines{% endif %}{% if aktywna_strona == 'recepty' %} main-content-prescriptions{% endif %}">
        {% block content %}{% endblock %}
      </main>
      <div class="app-toast" data-app-toast aria-live="polite"></div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script>
      window.showAppToast = function showAppToast(message) {
        const toast = document.querySelector("[data-app-toast]");

        if (!toast || !message) {
          return;
        }

        toast.textContent = message;
        toast.classList.add("visible");

        window.clearTimeout(window.showAppToast.timeoutId);
        window.showAppToast.timeoutId = window.setTimeout(() => {
          toast.classList.remove("visible");
        }, 2800);
      };

      document.querySelectorAll("[data-app-message]").forEach((element) => {
        element.addEventListener("click", () => {
          window.showAppToast(element.dataset.appMessage);
        });
      });

      document.querySelectorAll("[data-confirm-action]").forEach((element) => {
        element.addEventListener("click", (event) => {
          if (!window.confirm(element.dataset.confirmAction)) {
            event.preventDefault();
          }
        });
      });

      document.querySelectorAll("[data-auto-dismiss-alert]").forEach((alert) => {
        window.setTimeout(() => {
          alert.classList.add("is-hiding");

          window.setTimeout(() => {
            alert.remove();
          }, 240);
        }, 5000);
      });
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
