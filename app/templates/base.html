<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Portal Pacjenta{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    >
    <link rel="icon" type="image/png" href="/static/icons/favicon.png">
    <link rel="stylesheet" href="/static/css/app.css?v=26">
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <img
              src="/static/icons/HospHeart.png"
              alt="Portal Pacjenta"
              class="brand-logo"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
            >
            <span class="brand-fallback">P</span>
          </div>
          <p class="brand-title">Portal<br>Pacjenta</p>
        </div>

        <nav class="sidebar-nav">
          <a class="sidebar-link {% if aktywna_strona == 'dashboard' %}active{% endif %}" href="/panel-pacjenta">
            <span class="sidebar-icon">
              <img src="/static/icons/dashboard.svg" alt="" class="sidebar-icon-img">
            </span>
            <span>Dashboard</span>
          </a>
          <a class="sidebar-link {% if aktywna_strona == 'wizyty' %}active{% endif %}" href="/moje-wizyty">
            <span class="sidebar-icon">
              <img src="/static/icons/visits.svg" alt="" class="sidebar-icon-img">
            </span>
            <span>Wizyty</span>
          </a>
          <a class="sidebar-link {% if aktywna_strona == 'szybki_zapis' %}active{% endif %}" href="/szybki-zapis">
            <span class="sidebar-icon">
              <i class="bi bi-plus-lg sidebar-icon-bi" aria-hidden="true"></i>
            </span>
            <span>Szybki zapis</span>
          </a>
          <a class="sidebar-link {% if aktywna_strona == 'recepty' %}active{% endif %}" href="/recepty">
            <span class="sidebar-icon">
              <i class="bi bi-clipboard-pulse sidebar-icon-bi" aria-hidden="true"></i>
            </span>
            <span>Recepty</span>
          </a>
          <a class="sidebar-link {% if aktywna_strona == 'lekarze' %}active{% endif %}" href="/lekarze-widok">
            <span class="sidebar-icon">
              <img src="/static/icons/doctors.svg" alt="" class="sidebar-icon-img">
            </span>
            <span>Lekarze</span>
          </a>
          <a class="sidebar-link {% if aktywna_strona == 'apteki' %}active{% endif %}" href="/apteki">
            <span class="sidebar-icon">
              <img src="/static/icons/pharmacies.svg" alt="" class="sidebar-icon-img">
            </span>
            <span>Apteki</span>
          </a>
        </nav>

        <div class="sidebar-divider"></div>

        <nav class="sidebar-nav sidebar-secondary">
          <a class="sidebar-link {% if aktywna_strona == 'historia' %}active{% endif %}" href="/historia">
            <span class="sidebar-icon">
              <img src="/static/icons/history.svg" alt="" class="sidebar-icon-img">
            </span>
            <span>Historia</span>
          </a>
          <a class="sidebar-link {% if aktywna_strona == 'ustawienia' %}active{% endif %}" href="/ustawienia">
            <span class="sidebar-icon">
              <i class="bi bi-gear-wide-connected sidebar-icon-bi" aria-hidden="true"></i>
            </span>
            <span>Ustawienia</span>
          </a>
        </nav>

        <div class="sidebar-profile">
          <div class="profile-avatar">
            {{ pacjent["imie"][0] }}{{ pacjent["nazwisko"][0] }}
          </div>
          <div>
            <p class="profile-name">{{ pacjent["imie"] }} {{ pacjent["nazwisko"] }}</p>
            <p class="profile-role">Pacjent</p>
          </div>
        </div>
      </aside>

      <main class="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
