<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rejestracja | Portal Pacjenta</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    >
    <link rel="icon" type="image/png" href="/static/icons/favicon.png">
    <link rel="stylesheet" href="/static/css/app.css?v=85">
  </head>
  <body class="login-page">
    <main class="login-shell register-shell">
      <section class="login-hero" aria-label="Portal pacjenta">
        <header class="login-brand">
          <span class="login-brand-mark">
            <img src="/static/icons/HospHeart.png" alt="" aria-hidden="true">
          </span>
          <strong>PZU Zdrowie</strong>
        </header>

        <div class="login-copy">
          <h1>Załóż konto <span>pacjenta</span></h1>
          <p>Utwórz profil, aby zarządzać wizytami, lekami i receptami z jednego miejsca.</p>
        </div>

        <footer class="login-footer">
          <span>© 2026 PZU Zdrowie</span>
          <a href="/logowanie">Mam już konto</a>
        </footer>
      </section>

      <section class="login-card register-card" aria-labelledby="registerTitle">
        <div class="login-card-icon">
          <i class="bi bi-person-plus" aria-hidden="true"></i>
        </div>
        <h2 id="registerTitle">Rejestracja</h2>
        <p>Podaj podstawowe dane pacjenta</p>

        {% if komunikat_bledu %}
        <div class="login-alert error">{{ komunikat_bledu }}</div>
        {% endif %}

        <form class="login-form register-form" method="post" action="/rejestracja">
          <div class="register-two-columns">
            <label>
              <span class="visually-hidden">Imię</span>
              <i class="bi bi-person" aria-hidden="true"></i>
              <input type="text" name="imie" placeholder="Imię" value="{{ formularz.imie if formularz else '' }}" required>
            </label>

            <label>
              <span class="visually-hidden">Nazwisko</span>
              <i class="bi bi-person" aria-hidden="true"></i>
              <input type="text" name="nazwisko" placeholder="Nazwisko" value="{{ formularz.nazwisko if formularz else '' }}" required>
            </label>
          </div>

          <label>
            <span class="visually-hidden">Adres e-mail</span>
            <i class="bi bi-envelope" aria-hidden="true"></i>
            <input type="email" name="email" autocomplete="email" placeholder="Adres e-mail" value="{{ formularz.email if formularz else '' }}" required>
          </label>

          <label>
            <span class="visually-hidden">Telefon</span>
            <i class="bi bi-telephone" aria-hidden="true"></i>
            <input type="text" name="telefon" autocomplete="tel" placeholder="Telefon" value="{{ formularz.telefon if formularz else '' }}" required>
          </label>

          <label>
            <span class="visually-hidden">Data urodzenia</span>
            <i class="bi bi-calendar2-week" aria-hidden="true"></i>
            <input type="date" name="data_urodzenia" value="{{ formularz.data_urodzenia if formularz else '' }}">
          </label>

          <label>
            <span class="visually-hidden">Adres</span>
            <i class="bi bi-geo-alt" aria-hidden="true"></i>
            <input type="text" name="adres" placeholder="Adres" value="{{ formularz.adres if formularz else '' }}">
          </label>

          <label>
            <span class="visually-hidden">Hasło</span>
            <i class="bi bi-lock" aria-hidden="true"></i>
            <input type="password" name="haslo" autocomplete="new-password" placeholder="Hasło min. 8 znaków" required data-login-password>
            <button type="button" data-toggle-login-password>Pokaż</button>
          </label>

          <button class="login-submit" type="submit">
            Utwórz konto
            <i class="bi bi-arrow-right" aria-hidden="true"></i>
          </button>
        </form>

        <p class="login-register">
          Masz już konto?
          <a href="/logowanie">Zaloguj się</a>
        </p>
      </section>
    </main>

    <script>
      document.querySelector("[data-toggle-login-password]")?.addEventListener("click", (event) => {
        const input = document.querySelector("[data-login-password]");
        const button = event.currentTarget;

        if (!input) {
          return;
        }

        const shouldShowPassword = input.type === "password";
        input.type = shouldShowPassword ? "text" : "password";
        button.textContent = shouldShowPassword ? "Ukryj" : "Pokaż";
      });
    </script>
  </body>
</html>
