{% extends "base.html" %}

{% block title %}Apteki{% endblock %}

{% block content %}
<header class="page-header">
  <div>
    <h1 class="page-title">Apteki</h1>
    <p class="page-subtitle">Podstawowa lista aptek, którą później połączymy z mapą.</p>
  </div>
</header>

<section class="cards-grid">
  {% for apteka in apteki %}
  <article class="section-card directory-card">
    <div class="directory-icon">
      <i class="bi bi-prescription2" aria-hidden="true"></i>
    </div>
    <div>
      <h2 class="section-title">{{ apteka["nazwa"] }}</h2>
      <p>{{ apteka["adres"] }}</p>
      <span>{{ apteka["godziny"] }}</span>
    </div>
  </article>
  {% endfor %}
</section>
{% endblock %}
